governance:
  name: on-the-fly-repository-governance
  version: "1.1"
  revision: "2026-09-01"
  supersedes: "REPOSITORY_GOVERNANCE_v1.0.yaml"
  supersession_reason: >-
    v1.0 was authored for the ai-automation-department project. It was re-scoped to
    tehki/on-the-fly, its security-sensitive path list was corrected against files that
    actually exist, and the unsupportable two-approval control was replaced with an
    explicit documented limitation and compensating controls per Constitution Article 9.
  handbook_version: "1.4.1"
  constitution_version: "1.2"
  policy_version: "1.2"
  repository: tehki/on-the-fly
  repository_visibility: public
  default_branch: main

main_branch:
  protection_required: true
  pull_request_required: true
  direct_push_allowed: false
  force_push_allowed: false
  branch_deletion_allowed: false
  required_approvals: 0
  required_approvals_limitation: single_maintainer_population
  enforce_for_administrators: true
  require_code_owner_review: false
  require_code_owner_review_limitation: single_maintainer_population
  dismiss_stale_approvals: true
  require_conversation_resolution: true
  require_linear_history: true
  require_up_to_date_before_merge: true
  required_status_checks:
    - quality

# Human approval is not technically enforceable while the repository has one maintainer:
# GitHub does not permit a pull request author to approve their own pull request, so a
# non-zero approval requirement combined with enforce_for_administrators would block every
# merge. Constitution Article 9 requires that this limitation and its compensating controls
# be explicit rather than silently downgraded. See docs/EXCEPTIONS.md (EXC-2026-09-01-001).
approval_limitation:
  applies_to:
    - required_approvals
    - require_code_owner_review
  reason: single maintainer with write access (tehki)
  exception_record: EXC-2026-09-01-001
  compensating_controls:
    - pull_request_still_required_for_every_change
    - required_quality_status_check_must_pass
    - enforce_for_administrators_prevents_maintainer_bypass
    - direct_push_and_force_push_disabled
    - linear_history_and_conversation_resolution_required
    - main_push_provenance_detection
    - written_risk_and_retention_declaration_in_pull_request_template
  removal_condition: >-
    A second reviewer with write access is added; required_approvals is then raised to 1
    (2 for CRITICAL) and require_code_owner_review is enabled.

security_sensitive_paths:
  require_code_owner_review: true
  enforcement_note: >-
    CODEOWNERS assigns ownership and requests review on these paths. Blocking code-owner
    review is not active while approval_limitation applies; ownership routing is.
  paths:
    - /CODING_AGENT_CONSTITUTION_v1.2.md
    - /CODING_AGENT_POLICY_v1.2.yaml
    - /CODING_AGENT_DEVELOPMENT_PRINCIPLES_SYSTEM_PROMPT_v1.4.1.md
    - /REPOSITORY_GOVERNANCE_v1.1.yaml
    - /Makefile
    - /.github/workflows/
    - /.github/CODEOWNERS
    - /.github/pull_request_template.md
    - /scripts/validate_coding_agent_policy.py
    - /scripts/validate_repository_governance.py
    - /scripts/verify_main_push_provenance.py
    - /docs/SECURITY_PRIVACY.md
    - /docs/RETENTION_POLICY.md
    - /docs/GITHUB_REPOSITORY_GOVERNANCE.md
    - /docs/EXCEPTIONS.md
    - /docs/CODING_AGENT_ADOPTION.md
    - /src/on_the_fly/domain/retention/

risk_review:
  LOW:
    pull_request_required: true
    minimum_approvals: 0
    code_owner_required_when_path_matches: true
  MODERATE:
    pull_request_required: true
    minimum_approvals: 0
    code_owner_required_when_path_matches: true
    security_retention_review: true
  HIGH:
    pull_request_required: true
    minimum_approvals: 0
    explicit_owner_review: true
    required_status_checks: true
    target_reverification: true
    rollback_or_recovery_plan: true
  CRITICAL:
    pull_request_required: true
    minimum_approvals: 0
    minimum_approvals_when_supported: 2
    explicit_owner_review: true
    independent_human_review_when_supported: true
    independent_review_currently_supported: false
    required_status_checks: true
    target_reverification: true
    rollback_or_recovery_plan: true
    dry_run_or_reversible_alternative_review: true
    post_action_verification: true

emergency_changes:
  allowed: true
  require_explicit_exception: true
  require_owner: true
  require_reason: true
  require_scope: true
  require_expiry: true
  require_compensating_controls: true
  require_post_change_review: true
  prohibit_silent_direct_push_exception: true

ci:
  workflow: .github/workflows/ci.yml
  required_job: quality
  required_local_targets:
    - policy
    - governance
    - lint
    - typecheck
    - test
  policy_validator: scripts/validate_coding_agent_policy.py
  governance_validator: scripts/validate_repository_governance.py
  main_push_provenance_detection_required: true
  main_push_provenance_script: scripts/verify_main_push_provenance.py
  main_push_provenance_require_github_signed_merge: true
  main_push_provenance_require_previous_main_parent: true
  main_push_provenance_reject_forced_push: true

external_control_plane:
  provider: github
  branch_protection_or_ruleset_required: true
  repository_admin_configuration_required: true
  current_connector_can_write_branch_rules: true
  connector_capability_verified_at: "2026-09-01"
  connector_capability_evidence: >-
    gh CLI authenticated as tehki with 'repo' scope; repos/tehki/on-the-fly reports
    viewerPermission ADMIN. Technical capability is not standing authorization; writing
    branch rules requires an explicit scoped ADMIN capability grant per Constitution
    Article 3.
  verification_required_after_admin_configuration: true
  compensating_main_push_detection_required_while_unprotected: true
  documentation: docs/GITHUB_REPOSITORY_GOVERNANCE.md

truthfulness:
  never_claim_remote_branch_protection_without_verification: true
  local_ci_manifest_does_not_equal_remote_enforcement: true
  last_verified_remote_state:
    verified_at: "2026-09-01"
    branch_protection_present: false
    rulesets_present: false
    workflows_present: false
    vulnerability_alerts_enabled: false
    note: >-
      Baseline captured before this manifest was applied. Re-verify after any
      administrative configuration change; this record is evidence of a point in time,
      not a claim of current enforcement.
