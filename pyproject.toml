[project]
name = "on-the-fly"
version = "0.0.0"
description = "On the fly live translator - speak without bounds with anyone worldwide"
# The one place a Python version is declared. Ruff infers its target from this rather
# than carrying its own copy, and mypy is set to the same version below.
#
# Raised from 3.11 to 3.12 when numpy became a declared dependency: numpy 2.5 requires
# 3.12, so claiming 3.11 support would have been a declaration the project could not
# honour. Raised again to 3.13 on 2026-09-08 for the same reason in a different form —
# nothing ever ran the suite on 3.12. CI runs 3.13 and development runs 3.14; 3.12 was
# type-checked, which is analysis rather than execution, and a support claim nobody
# executes is the kind this repository spends its time removing.
requires-python = ">=3.13"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF"]
# S603/S607: subprocess use in the provenance script is argument-array form with a
# fixed executable, which is the safe construction the policy asks for.
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # pytest assertions
# RUF002 flags Cyrillic characters that resemble Latin ones. This module's docstring quotes
# real Russian model output as evidence that uppercase input is mistranslated (ADR 0009);
# the characters are the point, not a typo. Narrow to one file and one rule.
"src/on_the_fly/infrastructure/translation/opus_mt.py" = ["RUF002"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_configs = true
# The validators are standalone scripts and the application lives under src/, neither of
# which is an installed package. Putting both on the search path here lets the tests import
# them normally, instead of each test file mutating sys.path before its imports.
mypy_path = "scripts:src"

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true

# sounddevice ships no py.typed marker. It is used only in
# src/on_the_fly/infrastructure/audio/, behind the CaptureBackend port, so the
# untyped surface is one file wide.
[[tool.mypy.overrides]]
module = "sounddevice"
ignore_missing_imports = true

# faster_whisper and sherpa_onnx ship no py.typed marker. Both are used only in
# src/on_the_fly/infrastructure/asr/, behind the SpeechRecognizer port, so the untyped
# surface is two files wide.
#
# huggingface_hub was listed here as a third. It ships py.typed at the 1.30.0 that ADR 0036
# admitted, so the exemption suppressed nothing and stated something untrue about a package
# on the path that fetches model weights. The one call behind it, `snapshot_download` in
# ModelStore, was already being checked against the real signature and still is.
[[tool.mypy.overrides]]
module = ["faster_whisper", "sherpa_onnx"]
ignore_missing_imports = true

# onnxruntime ships no py.typed marker. It is used only in
# src/on_the_fly/infrastructure/translation/onnx_translator.py, behind the Translator port,
# so the untyped surface is one file wide — the same containment the other overrides here
# rely on rather than a blanket exemption.
[[tool.mypy.overrides]]
module = ["onnxruntime"]
ignore_missing_imports = true

# ctranslate2 ships no py.typed marker. It is used only in
# src/on_the_fly/infrastructure/translation/, behind the Translator port and
# TranslationModelStore, so the untyped surface is two files wide. sentencepiece needs no
# override: it ships stubs, and the protocols in opus_mt.py are written to match them.
[[tool.mypy.overrides]]
module = ["ctranslate2", "ctranslate2.converters"]
ignore_missing_imports = true

# PySide6 is an optional extra (ADR 0016) and CI deliberately does not install it — a 76 MB
# wheel on every run, to type-check code that needs a display to do anything, would be
# paying for nothing. So the type checker must pass both with it and without it.
[[tool.mypy.overrides]]
module = ["PySide6", "PySide6.*"]
ignore_missing_imports = true

# Without the stubs the Qt base classes resolve to Any, and strict mode refuses to subclass
# Any. Narrowed to the two modules that touch widgets; everything interesting about the
# window lives in ui/caption.py, which imports no Qt and is checked strictly.
[[tool.mypy.overrides]]
module = ["on_the_fly.ui.window", "on_the_fly.ui.app"]
disallow_subclassing_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts", "src"]
