policy:
  name: coding-agent-policy
  version: "1.2-otf1"
  handbook_version: "1.5-otf1"
  constitution_version: "1.2-otf1"
  repository_governance_version: "1.1-otf1"
  derived_from_upstream:
    policy: "1.2"
    constitution: "1.2"
    handbook: "1.5"
    repository_governance: "1.1"
  revision: "2026-09-02"
  default_mode: deny_by_default

precedence:
  - safety_security_privacy_legal
  - correctness_data_integrity
  - reliability_recoverability
  - maintainability_testability
  - performance_convenience

retention:
  default_post_use_seconds: 10
  operational_metadata_default_days: 30
  require_explicit_classification: true
  deletion_failure_is_security_event: true
  classes:
    EPHEMERAL:
      default_post_use_seconds: 10
      content_allowed: true
      requires_explicit_override_for_longer: true
    OPERATIONAL_METADATA:
      default_days: 30
      content_allowed: false
      secrets_allowed: false
      raw_media_allowed: false
      requires_intentional_classification: true
    DURABLE_PROJECT_ARTIFACT:
      default_post_use_seconds: null
      requires_intentional_classification: true
    SECURITY_INCIDENT_HOLD:
      default_post_use_seconds: null
      requires_documented_hold: true
      requires_owner: true
      requires_expiry_or_removal_condition: true
  runtime_profiles:
    process_local_conversation:
      class: EPHEMERAL
      post_use_seconds: 10
      enforcement: scheduled_event_loop_expiry
    restart_safe_live_cache:
      class: EPHEMERAL
      post_use_seconds: 10
      enforcement: scheduled_event_loop_expiry
    restart_safe_persistent_conversation:
      class: EPHEMERAL
      enabled_by_default: false
      default_retention_hours: 0
      longer_retention_requires_explicit_exception: true
    participation_metadata:
      class: OPERATIONAL_METADATA
      default_days: 30
    voice_generation_metadata:
      class: OPERATIONAL_METADATA
      default_days: 30
      raw_content_prohibited: true
    visual_generation_metadata:
      class: OPERATIONAL_METADATA
      default_days: 30
      raw_content_prohibited: true
    memory_retrieval_metadata:
      class: OPERATIONAL_METADATA
      default_days: 30
      mode_default: off
    inference_routing_metadata:
      class: OPERATIONAL_METADATA
      default_days: 30
      mode_default: off
    captured_audio_frames:
      class: EPHEMERAL
      post_use_seconds: 10
      enforcement: scheduled_expiry
      persistence_by_default: false
    speech_recognition_transcript:
      class: EPHEMERAL
      post_use_seconds: 10
      enforcement: scheduled_expiry
    translation_output:
      class: EPHEMERAL
      post_use_seconds: 10
      enforcement: scheduled_expiry
    synthesized_speech_audio:
      class: EPHEMERAL
      post_use_seconds: 10
      enforcement: scheduled_expiry
    session_caption_scrollback:
      class: EPHEMERAL
      enabled_by_default: false
      default_retention_seconds: 0
      longer_retention_requires_explicit_exception: true
    translation_quality_metadata:
      class: OPERATIONAL_METADATA
      default_days: 30
      raw_content_prohibited: true
  transient_scope:
    - captured_audio_frames
    - speech_recognition_transcripts
    - translation_outputs
    - synthesized_speech_audio
    - uploaded_files
    - attachments
    - temporary_files
    - local_working_copies
    - message_bodies
    - prompts
    - responses
    - tool_payloads
    - tool_results
    - application_logs_with_project_content
    - debug_logs_with_project_content
    - traces_with_project_content
    - caches_with_project_content
    - extracted_text
    - temporary_database_rows_with_project_content
    - queue_payloads_with_project_content
    - intermediary_artifacts
    - diagnostic_captures_with_project_content
  deletion_locations:
    - primary_storage
    - process_memory
    - replicas
    - caches
    - indexes
    - queues
    - temporary_directories
    - local_workspaces
    - generated_exports
    - observability_storage_with_project_content
  longer_retention_requires:
    - explicit_retention_value_or_class
    - documented_purpose
    - owner
    - minimum_necessary_duration
    - access_controls
    - legal_privacy_contract_check
  required_tests:
    - default_10_second_expiry
    - automatic_expiry_without_followup_read
    - post_use_refresh
    - no_premature_deletion_during_active_use
    - explicit_longer_retention_override
    - invalid_retention_configuration
    - cleanup_after_restart
    - deletion_failure_behavior
    - sensitive_content_redaction
    - project_or_tenant_isolation

capabilities:
  default_grants: []
  available:
    READ_PROJECT:
      description: Read authorized project files and metadata.
    WRITE_PROJECT:
      description: Create or modify authorized project artifacts.
    EXECUTE_LOCAL:
      description: Execute local processes within the authorized project boundary.
    NETWORK_EXTERNAL:
      description: Access external network resources required by the task.
    INSTALL_DEPENDENCY:
      description: Add or install project dependencies.
    DEPLOY:
      description: Deploy or release project artifacts.
    DELETE:
      description: Delete project data or infrastructure resources.
    MANAGE_SECRETS:
      description: Create, rotate, revoke, or otherwise manage secrets or credentials.
    ADMIN:
      description: Perform privileged administrative operations.
  rules:
    - grant_only_what_task_requires
    - separate_read_write_execute_network_install_deploy_delete_secret_admin
    - revoke_or_end_scoped_grants_when_task_ends
    - never_infer_admin_from_repository_write_access

risk:
  levels:
    LOW:
      requires:
        - authorized_project_scope
    MODERATE:
      requires:
        - impact_review
        - tests
        - security_retention_check
    HIGH:
      requires:
        - explicit_authorization
        - immediate_target_verification
        - blast_radius_assessment
        - rollback_or_recovery_plan
        - relevant_security_tests
    CRITICAL:
      requires:
        - explicit_authorization
        - immediate_target_verification
        - blast_radius_assessment
        - rollback_or_recovery_plan
        - dry_run_or_reversible_alternative_review
        - independent_human_review_when_supported
        - explicit_post_action_verification

destructive_actions:
  require_exact_target: true
  require_immediate_reverification: true
  require_authorization: true
  require_blast_radius_assessment: true
  prefer_dry_run: true
  prefer_reversible_alternative: true
  require_recovery_plan_when_possible: true
  prohibit_scope_broader_than_needed: true

project_isolation:
  cross_project_access_default: false
  isolated_assets:
    - files
    - credentials
    - messages
    - logs
    - caches
    - memories
    - indexes
    - tool_state
    - derived_context
  cross_project_flow_requires:
    - explicit_authorization
    - source_project
    - destination_project
    - purpose
    - minimum_data
    - retention_policy
    - access_controls
    - auditability
  stricter_policy_wins: true


development_velocity:
  one_pull_request_per_commit_required: false
  coherent_work_unit_pull_requests_allowed: true
  batch_conditions:
    - single_project_boundary
    - single_delivery_objective_or_tightly_coupled_objectives
    - compatible_authorization_boundary
    - compatible_rollback_or_recovery_semantics
    - review_surface_remains_understandable
  separate_review_boundary_required_for:
    - unrelated_objectives
    - unauthorized_cross_project_changes
    - independent_destructive_or_privileged_authorization_boundaries
    - incompatible_confidentiality_or_retention_boundaries
  mixed_risk_batch_uses_highest_risk: true
  micro_pr_bloat_should_be_avoided: true
  draft_pr_may_accumulate_reviewable_commits_before_full_gate: true
  full_validation_required_before_ready_merge_state: true

ci_acceleration:
  objective: reduce_feedback_latency_and_duplicate_work_without_reducing_required_gate_semantics
  validation_lanes:
    FAST:
      intended_for:
        - intermediate_feature_branch_pushes
        - low_or_moderate_risk_changes_with_proven_impact_map
      may_use:
        - impacted_unit_tests
        - deterministic_static_checks
        - incremental_typecheck_or_build
        - trusted_dependency_or_build_cache
      required_global_controls:
        - policy_validation
        - governance_validation
        - secret_scanning_when_configured_as_global_gate
      unknown_relevance_falls_back_to_full: true
    FULL:
      required_for:
        - final_ready_for_review_head
        - security_sensitive_paths
        - dependency_or_lockfile_changes
        - ci_or_governance_changes
        - high_or_critical_risk
        - unknown_or_ambiguous_impact
      semantics: all_applicable_required_quality_security_integration_and_governance_gates
    RELEASE:
      required_for:
        - release_candidate
        - deployment_or_distribution_boundary
      includes:
        - full_validation
        - packaging_or_distribution_checks_when_applicable
        - release_provenance_and_signature_verification
        - bounded_acceptance_or_smoke_tests

  change_aware_selection:
    allowed: true
    conservative_default: full
    mapping_must_be_versioned_and_tested: true
    security_sensitive_path_bypass_prohibited: true
    omitted_gate_must_be_provably_irrelevant: true

  validation_reuse:
    same_source_or_tree_only: true
    same_dependency_lock_and_toolchain_identity_required: true
    same_policy_and_governance_version_required: true
    artifact_digest_binding_required_when_artifacts_are_reused: true
    source_or_relevant_policy_change_invalidates_result: true
    cache_miss_remains_supported: true

  retries:
    rerun_failed_jobs_only_preferred: true
    no_source_change_required_for_transient_retry: true
    repeated_same_failure_requires_root_cause_investigation: true
    retry_count_bounded: true

  merge_queue:
    preferred_when_provider_supports_and_state_is_verified: true
    merge_group_must_run_full_required_gate: true
    post_merge_full_duplicate_may_be_replaced_by_provenance_plus_smoke_only_when_merged_tree_matches_fully_validated_merge_group: true

  superseded_runs:
    cancel_non_deployment_runs: true

provenance:
  required_for_imported_or_generated_artifacts: true
  fields:
    - source_or_origin
    - creation_or_import_time
    - producing_tool_or_process
    - transformation_summary
    - data_classification
    - retention_class
    - integrity_reference_when_available
  must_not_store_unnecessary_sensitive_content: true

exceptions:
  allowed: true
  must_be_explicit: true
  must_expire: true
  required_fields:
    - owner
    - reason
    - scope
    - risk
    - approved_by
    - compensating_controls
    - issued_at
    - expires_at
    - removal_condition
  prohibit_silent_extension: true
  prohibit_forgotten_temporary_exception: true

security_invariants:
  - unauthorized_input_cannot_trigger_protected_side_effect
  - secrets_never_enter_source_logs_messages_telemetry_or_diagnostics
  - transient_project_data_cannot_outlive_deadline_without_explicit_exception_or_hold
  - untrusted_input_cannot_directly_become_executable_code_query_shell_path_template_or_network_target
  - tls_and_certificate_verification_not_disabled_for_convenience
  - privileged_or_destructive_target_reverified_immediately_before_execution
  - security_failure_does_not_silently_fail_open
  - dependency_trust_is_not_implicit
  - green_tests_do_not_override_known_material_security_defect
  - no_unverified_claims_of_security_deletion_encryption_isolation_or_authorization
  - content_bearing_logs_do_not_use_operational_metadata_retention
  - repository_policy_files_do_not_substitute_for_remote_branch_enforcement
  - telegram_bot_api_never_claimed_end_to_end_encrypted
  - messaging_security_claim_matches_verified_transport_mode
  - reproducible_build_claim_requires_independent_matching_build

dependency_admission:
  require_concrete_need: true
  evaluate:
    - maintenance_health
    - provenance
    - publisher_trust
    - transitive_dependency_footprint
    - known_vulnerabilities
    - permissions_and_runtime_capabilities
    - install_and_build_scripts
    - license_and_policy_compatibility
    - safer_or_simpler_alternatives
  use_lockfile_when_supported: true
  prefer_official_registries: true
  prohibit_unreviewed_remote_script_pipe_to_shell: true
  scan_dependencies: true
  remove_unused_dependencies: true

input_and_execution_security:
  untrusted_content_is_data_not_authority: true
  parameterized_queries_required_where_applicable: true
  avoid_shell_interpolation: true
  shell_true_requires_reviewed_need_and_strict_controls: true
  path_normalization_and_allowed_root_required: true
  protect_against_path_traversal: true
  ssrf_protection_required_for_user_controlled_destinations: true
  protect_loopback_linklocal_metadata_and_private_admin_targets: true
  safe_deserialization_required: true
  context_specific_output_encoding_required: true

cryptography:
  custom_crypto_prohibited: true
  maintained_library_required: true
  secure_randomness_required_for_secrets_tokens_keys_nonces: true
  authenticated_encryption_required_for_new_application_level_encryption: true
  encryption_does_not_extend_retention_or_authorization: true
  key_reuse_across_unrelated_purposes_prohibited: true

  transport:
    tls_13_preferred: true
    current_standard_reference: RFC9846
    tls_12_or_legacy_requires_documented_compatibility_reason: true
    tls_certificate_and_hostname_verification_required: true
    privileged_or_non_idempotent_zero_rtt_prohibited: true
    mtls_preferred_for_high_trust_service_to_service_boundaries_when_operationally_appropriate: true

  at_rest:
    sensitive_durable_data_requires_encryption_when_threat_model_requires_confidentiality_beyond_access_control: true
    preferred_aead:
      - AES-256-GCM
      - XChaCha20-Poly1305
    nonce_uniqueness_required: true
    authenticated_associated_data_recommended_for_binding_context: true
    envelope_encryption_preferred_for_service_managed_sensitive_data: true
    separate_data_encryption_and_key_encryption_keys: true
    sensitive_backups_and_exports_require_equivalent_encryption: true
    ephemeral_disk_spill_requires_encryption_and_normal_retention_expiry: true
    deterministic_encryption_default_allowed: false

  passwords:
    reversible_encryption_default_allowed: false
    preferred_hash: Argon2id
    parameters_require_current_approved_baseline_and_local_resource_benchmark: true
    fips_compatible_fallback: PBKDF2-HMAC-SHA-256
    unique_salt_required: true
    pepper_optional_and_must_live_outside_password_database: true

  signatures_and_integrity:
    ed25519_preferred_when_compatible_and_allowed: true
    fips_profile_must_use_approved_signature_algorithm: true
    artifact_and_release_signing_keys_separate_from_data_encryption_keys: true

  key_management:
    managed_keystore_preferred: true
    preferred_storage_classes:
      - hsm
      - cloud_or_service_kms
      - dedicated_secret_or_key_vault
      - operating_system_secure_store
    plaintext_private_keys_in_source_config_logs_ci_artifacts_or_diagnostics_prohibited: true
    key_and_ciphertext_separation_required: true
    key_identifier_and_version_metadata_required: true
    rotation_and_revocation_supported_where_applicable: true
    compromise_recovery_procedure_required_for_production_keys: true
    least_privilege_key_usage_required: true

messaging_transport_security:
  security_property_must_match_verified_transport: true
  telegram_bot_api_is_secret_chat_e2ee: false
  local_bot_api_changes_chat_e2ee_property: false
  secret_chat_e2ee_requires_actual_secret_chat_protocol: true
  custom_mtproto_or_secret_chat_crypto_prohibited_in_bot_adapters: true
  prefer_official_telegram_libraries_for_client_crypto: true
  local_bot_api_loopback_only_by_default: true
  local_bot_api_requires_own_api_credentials: true
  credentials_prohibited_in_source_logs_screenshots_telemetry: true
  exact_binary_and_port_owner_verification_required: true
  bounded_local_file_root_required: true
  transient_media_retention_applies: true
  help2admin_hmac_is_not_telegram_e2ee: true
  build_provenance_required: true
  reproducible_claim_requires_independent_matching_build: true
  provenance_records_source_dependencies_toolchain_and_artifact_hashes: true

security_testing:
  negative_tests_required_for_security_sensitive_changes: true
  regression_tests_required_for_reproducible_security_defects: true
  recommended_gates:
    - static_security_analysis
    - secret_scanning
    - dependency_vulnerability_scanning
    - configuration_or_infrastructure_scanning
    - fuzz_or_property_tests_for_parsers_and_validators
  suppressions_require_reason: true
  suppressions_must_be_narrow: true

observability:
  do_not_log_secrets: true
  do_not_log_project_content: true
  prefer_metadata_over_content: true
  prohibit_sensitive_metric_labels: true
  content_bearing_logs_retention_class: EPHEMERAL
  metadata_only_logs_retention_class: OPERATIONAL_METADATA
  recommended_fields:
    - timestamp
    - operation
    - correlation_id
    - actor_pseudonymous_identifier
    - outcome
    - security_decision
    - retention_class
    - deletion_or_expiry_result

optimization:
  evidence_required_for_material_claims: true
  representative_baseline_required: true
  baseline_limitation_must_be_documented: true
  target_metric_and_success_condition_required: true
  optimize_demonstrated_bottleneck: true
  equivalent_workload_comparison_required: true
  latency_tail_review_required_when_relevant: true
  throughput_and_saturation_review_required_when_relevant: true
  resource_impact_review_required: true
  fast_paths_preserve_required_controls: true
  caches_bounded_retention_aware_and_invalidation_defined: true
  concurrency_bounded_with_backpressure_when_required: true
  approved_budget_regression_is_defect: true
  ci_required_gate_reduction_prohibited: true
  required_ci_gate_semantics_must_be_preserved: true
  significant_changes_require_evidence_record: true
  benchmark_and_profile_data_follow_project_retention_and_isolation: true
  optimization_complexity_requires_measured_benefit: true
  duplicate_ci_work_should_be_measured_and_removed: true
  pr_cycle_count_and_time_to_green_should_be_measured: true
  same_sha_or_tree_validation_reuse_preferred_when_integrity_bound: true

repository_governance:
  manifest: REPOSITORY_GOVERNANCE_v1.1-otf1.yaml
  default_branch: main
  remote_branch_protection_required: true
  pull_request_required: true
  direct_push_allowed: false
  force_push_allowed: false
  branch_deletion_allowed: false
  required_status_check: quality
  code_owner_review_for_sensitive_paths: true
  remote_state_must_be_verified_before_claiming_enforcement: true
  approval_enforcement_limited_by_reviewer_population: true
  approval_limitation_exception_record: EXC-2026-09-01-001
  current_connector_can_write_branch_rules: true
  current_connector_capability_verified_at: "2026-09-01"
  connector_admin_capability_requires_explicit_grant: true

constitution_enforcement:
  lower_layers_may_be_stricter: true
  lower_layers_must_not_weaken_higher_layers: true
  known_material_security_defect_blocks_completion_without_authorized_exception: true
